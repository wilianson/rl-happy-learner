# render.yaml — Happy RL Trainer
# Despliegue automático en Render.com (tier gratuito)
# Docs: https://render.com/docs/blueprint-spec

services:
  # ──────────────────────────────────────────────
  # BACKEND: FastAPI + WebSockets
  # ──────────────────────────────────────────────
  - type: web
    name: happy-rl-trainer-backend
    runtime: python
    region: oregon          # Oregon es más rápido desde LATAM que Frankfurt
    plan: free              # Free tier: 512MB RAM, comparte CPU, cold starts
    rootDir: backend
    buildCommand: >
      pip install --upgrade pip &&
      pip install torch --index-url https://download.pytorch.org/whl/cpu &&
      pip install -r requirements-prod.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
    healthCheckPath: /health

  # ──────────────────────────────────────────────
  # FRONTEND: React/Vite (Static Site)
  # ──────────────────────────────────────────────
  - type: web
    name: happy-rl-trainer-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_WS_URL
        value: wss://happy-rl-trainer-backend.onrender.com/ws/train
    routes:
      - type: rewrite
        source: /*
        destination: /index.html   # SPA fallback para React Router
